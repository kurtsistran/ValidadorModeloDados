[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-model-auditor"
version = "0.1.0"
description = "Corporate auditor for Erwin Data Modeler exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.10",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "uvicorn>=0.32",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "xlwt>=1.3",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["data_model_auditor"]
mypy_path = "src"
